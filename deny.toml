# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

# Vulnerability database checks
[advisories]
# Deny any crate with a known security vulnerability
version = 2
ignore = [
    # Advisories published after the v1.15.0 fork lockfile for pinned crates in
    # Cargo.lock (unsafe-libyaml, event-listener, lru, rustls, quinn-proto,
    # quinn-udp, webpki-roots, rustls-webpki, webpki-root-certs, ctutils, tokio,
    # p256, zstd/zstd-safe/zstd-sys, pulldown-cmark, libz-sys, rusqlite,
    # cap-primitives, rustix, chrono, url).
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0221",
    "RUSTSEC-2026-0253",
    "RUSTSEC-2026-0285",
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0341",
    "RUSTSEC-2026-0342",
    "RUSTSEC-2026-0343",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0347",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0383",
    "RUSTSEC-2026-0385",
    "RUSTSEC-2026-0386",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
    "RUSTSEC-2026-0410",
    "RUSTSEC-2026-0414",
    "RUSTSEC-2026-0418",
    "RUSTSEC-2026-0433",
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0482",
